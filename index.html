<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olivier</title>
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<canvas class="kimberley-astro-gl" id="kimberleyAstroGL" aria-hidden="true"></canvas>
<canvas class="kimberley-shockwave" id="kimberleyShockwave" aria-hidden="true"></canvas>
<canvas class="kimberley-fire-wash" id="kimberleyFireWash" aria-hidden="true"></canvas>
<h1 class="kimberley-sr-only">OLIVIER</h1>

<p class="kimberley-credit" lang="en">
    <span class="kimberley-credit-by">by</span><span class="kimberley-credit-mark">StudioKimberley</span>
</p>

<div class="kimberley-intro" id="kimberleyIntro" lang="da">
    <p class="kimberley-intro-lead" data-kimberley-type>Godt du kom forbi.</p>
    <p class="kimberley-intro-line" data-kimberley-type>Du er på vej ind i et univers af det, jeg er lavet af: visuelt design, digital udvikling, fotografi og alt for mange timer foran en skærm.</p>
    <p class="kimberley-intro-cue" data-kimberley-type>Rul, så åbner det sig.</p>
</div>

<div class="kimberley-scroll-track" id="kimberleyScrollTrack" aria-hidden="true"></div>

<script src="kimberley-driver.js"></script>
<script src="kimberley-intro.js"></script>
<script type="module" src="kimberley-scene.js"></script>
<script type="module" src="kimberley-scars.js"></script>
<script type="module" src="kimberley-starfield.js"></script>
<script type="module" src="kimberley-rocket.js"></script>
<script src="kimberley-shockwave.js"></script>
<script src="kimberley-firewash.js"></script>

</body>
</html>
